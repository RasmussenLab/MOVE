# The t-test association method has not been reimplemented in MOVE 2. This
# config raises an error explaining so; use `identify_associations_bayes`.

defaults:
  - task_associations
  - model_config: vae
  - training_loop_config/optimizer_config: optim_adam
  - training_loop_config/lr_scheduler_config: null

_target_: move.tasks.associations.identify_associations_ttest
